services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qtrader
      POSTGRES_USER: qtrader
      POSTGRES_PASSWORD: qtrader_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtrader -d qtrader"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API + Dashboard (Phase 7)
  api:
    build: .
    command: uvicorn qtrader.interfaces.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduled workers (Phase 2+)
  worker:
    build: .
    command: arq qtrader.infrastructure.schedulers.worker.WorkerSettings
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
