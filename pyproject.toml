[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qtrader"
version = "0.1.0"
description = "Multi-Agent AI Trading System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # web / api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # config & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "greenlet>=3.0",
    # cache / coordination
    "redis>=5.0",
    # data
    "numpy>=1.26",
    "pandas>=2.2",
    # async / resilience
    "tenacity>=8.3",
    "structlog>=24.1",
    "punq>=0.7",
    "typer>=0.12",
    "httpx>=0.27",
    # scheduler / worker
    "arq>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
qtrader = "qtrader.interfaces.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qtrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires live Postgres/Redis (docker compose)",
    "e2e: full end-to-end pipeline run",
]

[tool.coverage.run]
source = ["qtrader"]
omit = ["src/qtrader/interfaces/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
explicit_package_bases = true
mypy_path = "src"
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
module = "typer.*"
ignore_missing_imports = true
